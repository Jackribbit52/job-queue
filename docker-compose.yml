services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobqueue
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    command: node src/server.js
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobqueue
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: node src/worker.js
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobqueue
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata: